<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
    <style>
    /* Estilo moderno para los botones del menú */
    .btn-nav {
        background: linear-gradient(135deg, #007bff, #0056b3); /* Degradado elegante */
        color: white;
        padding: 10px 22px;
        border-radius: 16px; /* Bordes más redondeados tipo píldora */
        text-decoration: none;
        font-family: Arial, sans-serif;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 0.5px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); /* Sombra elegante */
        transition: all 0.3s ease; /* Hace que todas las animaciones sean suaves */
        display: inline-block;
    }

    /* EFECTO HOVER: Qué pasa cuando pones el cursor encima */
    .btn-nav:hover {
        background: linear-gradient(135deg, #0056b3, #003d80); /* Oscurece ligeramente */
        transform: translateY(-3px); /* Eleva el botón 3 píxeles hacia arriba */
        box-shadow: 0 6px 15px rgba(0, 123, 255, 0.4); /* La sombra se expande e ilumina */
    }

    /* EFECTO ACTIVE: Qué pasa cuando le das clic */
    .btn-nav:active {
        transform: translateY(-1px); /* Baja un poco al presionar */
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }
</style>
</head>
